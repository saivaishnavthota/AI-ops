version: '3.8'

# PRODUCTION CONFIGURATION
# ========================
# SECURITY REQUIREMENTS:
# 1. Create .env file with all required values (copy from .env.example)
# 2. Generate strong SECRET_KEY: python -c "import secrets; print(secrets.token_urlsafe(32))"
# 3. Set strong POSTGRES_PASSWORD (min 16 chars, mixed case, numbers, symbols)
# 4. Set ANTHROPIC_API_KEY if AI features are needed
# 5. Configure CORS_ORIGINS with your actual domain(s) - NEVER use wildcards
#
# Before deploying:
# - Remove database/redis port exposures (commented out below)
# - Configure SSL/TLS via reverse proxy
# - Set up proper monitoring and logging

services:
  # Frontend - React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiops-frontend-prod
    restart: unless-stopped
    ports:
      - "6201:7026"
    depends_on:
      - backend
    networks:
      - aiops-network
    environment:
      - NODE_ENV=production

  # Backend - FastAPI Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiops-backend-prod
    restart: unless-stopped
    ports:
      - "6200:7027"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aiops-network
    environment:
      # Database - REQUIRED: Set POSTGRES_PASSWORD in .env
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-aiops_db}
      - REDIS_URL=redis://redis:6379/0
      # Security - REQUIRED: Set SECRET_KEY in .env
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENVIRONMENT=production
      - DEBUG=false
      # CORS - REQUIRED: Set your actual domain(s), NEVER use wildcards
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is required - set your domain}
      # AI/ML - Optional
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7027/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: aiops-postgres-prod
    restart: unless-stopped
    # SECURITY: Comment out ports in production - use internal network only
    # ports:
    #   - "6204:5432"
    networks:
      - aiops-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aiops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-aiops_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops} -d ${POSTGRES_DB:-aiops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aiops-redis-prod
    restart: unless-stopped
    # SECURITY: Comment out ports in production - use internal network only
    # ports:
    #   - "6203:6379"
    networks:
      - aiops-network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker for Background Tasks
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiops-celery-worker-prod
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - aiops-network
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-aiops_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - backend_logs:/app/logs

  # Celery Beat for Scheduled Tasks
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiops-celery-beat-prod
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      - celery_worker
      - redis
    networks:
      - aiops-network
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2

networks:
  aiops-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
