<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Features Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .button {
            padding: 10px 15px;
            margin: 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 3px;
            white-space: pre-wrap;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AI-First Service Desk - Feature Test</h1>

        <div class="section">
            <h3>Authentication</h3>
            <button class="button" onclick="login()">Login as Admin</button>
            <div id="auth-result" class="result"></div>
        </div>

        <div class="section">
            <h3>Create Test Ticket</h3>
            <button class="button" onclick="createTicket()">Create Password Reset Ticket</button>
            <div id="ticket-result" class="result"></div>
        </div>

        <div class="section">
            <h3>AI Classification</h3>
            <button class="button" onclick="classifyTicket()">Classify with AI</button>
            <div id="classify-result" class="result"></div>
        </div>

        <div class="section">
            <h3>Smart Routing</h3>
            <button class="button" onclick="routeTicket()">Get AI Routing Recommendations</button>
            <div id="routing-result" class="result"></div>
        </div>

        <div class="section">
            <h3>Analytics</h3>
            <button class="button" onclick="getTrends()">Get Support Trends</button>
            <button class="button" onclick="getKnowledgeGaps()">Get Knowledge Gaps</button>
            <div id="analytics-result" class="result"></div>
        </div>
    </div>

    <script>
        let token = '';
        let currentTicketId = '';

        async function login() {
            const resultDiv = document.getElementById('auth-result');
            try {
                const response = await fetch('http://localhost:7027/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@demo.com',
                        password: 'Demo@123!'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    token = data.access_token;
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ Login successful! Token received.';
                } else {
                    throw new Error('Login failed');
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Login failed: ' + error.message;
            }
        }

        async function createTicket() {
            const resultDiv = document.getElementById('ticket-result');
            if (!token) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Please login first';
                return;
            }

            try {
                const response = await fetch('http://localhost:7027/api/v1/tickets', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        subject: 'Password Reset Request - Urgent',
                        description: 'I forgot my password and cannot access my account. This is blocking my work. Please help me reset it urgently.',
                        priority: 'high',
                        category: 'authentication'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentTicketId = data.id;
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Ticket created successfully!\nID: ${data.id}\nSubject: ${data.subject}\nStatus: ${data.status}`;
                } else {
                    throw new Error('Failed to create ticket');
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Failed to create ticket: ' + error.message;
            }
        }

        async function classifyTicket() {
            const resultDiv = document.getElementById('classify-result');
            if (!token || !currentTicketId) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Please login and create a ticket first';
                return;
            }

            try {
                const response = await fetch(`http://localhost:7027/api/v1/tickets/${currentTicketId}/ai-classify`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ AI Classification Results:
Intent: ${data.ai_analysis.intent}
Category: ${data.ai_analysis.category}
Priority: ${data.ai_analysis.priority}
Confidence: ${Math.round(data.ai_analysis.confidence * 100)}%
Keywords: ${data.ai_analysis.keywords.join(', ')}
KB Articles Found: ${data.kb_articles_found}`;
                } else {
                    throw new Error('Classification failed');
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ AI Classification failed: ' + error.message;
            }
        }

        async function routeTicket() {
            const resultDiv = document.getElementById('routing-result');
            if (!token || !currentTicketId) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Please login and create a ticket first';
                return;
            }

            try {
                const response = await fetch(`http://localhost:7027/api/v1/tickets/${currentTicketId}/ai-route`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.className = 'result success';
                    let result = `✅ Smart Routing Results:
Recommended Agent: ${data.recommended_agent?.agent_name || 'None'}
Match Score: ${data.recommended_agent ? Math.round(data.recommended_agent.score * 100) + '%' : 'N/A'}
Availability: ${data.recommended_agent?.availability || 'N/A'}
Current Workload: ${data.recommended_agent?.current_workload || 'N/A'} tickets
Confidence: ${Math.round(data.confidence * 100)}%
Reasoning: ${data.reasoning}`;

                    if (data.alternative_agents && data.alternative_agents.length > 0) {
                        result += '\n\nAlternative Agents:';
                        data.alternative_agents.forEach((agent, index) => {
                            result += `\n${index + 1}. ${agent.agent_name} (${Math.round(agent.score * 100)}% match, ${agent.availability})`;
                        });
                    }

                    if (data.escalation_needed) {
                        result += '\n\n⚠️ Escalation recommended';
                    }

                    resultDiv.textContent = result;
                } else {
                    throw new Error('Routing failed');
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Smart Routing failed: ' + error.message;
            }
        }

        async function getTrends() {
            const resultDiv = document.getElementById('analytics-result');
            if (!token) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Please login first';
                return;
            }

            try {
                const response = await fetch('http://localhost:7027/api/v1/tickets/ai-analytics/trends', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.className = 'result success';
                    let result = `✅ Support Trends Analysis:
Total Trends: ${data.total_trends}
High Impact Trends: ${data.high_impact_trends}
Analysis Period: ${data.analysis_period_days} days`;

                    if (data.trends && data.trends.length > 0) {
                        result += '\n\nTop Trends:';
                        data.trends.slice(0, 3).forEach((trend, index) => {
                            result += `\n${index + 1}. ${trend.category}: ${trend.description}
   Impact: ${trend.impact_score}/10, Confidence: ${Math.round(trend.confidence * 100)}%`;
                        });
                    }

                    resultDiv.textContent = result;
                } else {
                    throw new Error('Failed to get trends');
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Failed to get trends: ' + error.message;
            }
        }

        async function getKnowledgeGaps() {
            const resultDiv = document.getElementById('analytics-result');
            if (!token) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Please login first';
                return;
            }

            try {
                const response = await fetch('http://localhost:7027/api/v1/knowledge-base/ai-analytics/gaps', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.className = 'result success';
                    let result = `✅ Knowledge Base Gap Analysis:
Total Gaps: ${data.total_gaps}
High Priority Gaps: ${data.high_priority_gaps}
Recommended Articles: ${data.recommended_articles}
Analysis Period: ${data.analysis_period_days} days`;

                    if (data.knowledge_gaps && data.knowledge_gaps.length > 0) {
                        result += '\n\nTop Knowledge Gaps:';
                        data.knowledge_gaps.slice(0, 3).forEach((gap, index) => {
                            result += `\n${index + 1}. ${gap.topic || gap.category || 'Unknown'}: ${gap.description || 'Gap identified'}
   Priority: ${gap.priority || 'medium'}, Related Tickets: ${gap.ticket_count || 0}`;
                        });
                    }

                    resultDiv.textContent = result;
                } else {
                    throw new Error('Failed to get knowledge gaps');
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Failed to get knowledge gaps: ' + error.message;
            }
        }
    </script>
</body>

</html>
